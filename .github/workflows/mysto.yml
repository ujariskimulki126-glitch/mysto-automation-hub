
name: MYSTO AI Production

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8,13,19 * * *"
      timezone: "Asia/Jakarta"

permissions:
  contents: read

concurrency:
  group: mysto-production
  cancel-in-progress: false

jobs:
  create-video:
    name: MYSTO AI Video Factory
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version
          ffprobe -version

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Gemini API
        run: |
          python -c "from google import genai; import os; c=genai.Client(api_key=os.environ['GEMINI_API_KEY']); print('Gemini SDK ready')"

      - name: Run MYSTO AI Engine
        run: python mysto_engine.py

      - name: Save generated videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysto-video-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 3
